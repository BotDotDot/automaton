# Container and network settings for bots and ollama-gw.
# Sourced by scripts/bots/bot.sh. No secrets here. Override the path with
# BOTS_CONF=/path/to/other.conf (the isolation tests do this).

# Prefix for every container, network and volume name, and the
# economy.prefix label. kill-all with the default prefix "economy" stops
# every bot and gateway container on the machine, whatever its prefix.
ECONOMY_PREFIX=economy

# Kill-switch flag lives here. While $STATE_DIR/KILLED exists, nothing starts.
STATE_DIR="$HOME/.bot-economy"

BOT_IMAGE=bot-economy/bot:dev
GW_IMAGE=bot-economy/ollama-gw:dev

# Population ceiling (CLAUDE.md: default 10, configurable up to 20).
MAX_BOTS=10

# Per-bot limits
BOT_CPUS=1.0
BOT_MEMORY=1g
BOT_PIDS=256
BOT_TMP_SIZE=256m
BOT_NOFILE=1024

# Gateway limits
GW_CPUS=0.5
GW_MEMORY=128m
GW_PIDS=64
GW_MAX_BODY_BYTES=4194304

# Uplink: a private bridge that only ollama-gw joins. Ollama on the host
# listens on its gateway address (see deploy/ollama/override.conf), so it is
# reachable from this PC only, and never directly from a bot network.
UPLINK_SUBNET=172.30.255.0/29
UPLINK_GATEWAY=172.30.255.1
UPLINK_BRIDGE=br-ollama-up
OLLAMA_UPSTREAM=http://172.30.255.1:11434
