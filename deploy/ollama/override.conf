# systemd drop-in for the host Ollama service. Halco installs it (needs sudo):
#
#   sudo install -D -m 644 deploy/ollama/override.conf \
#        /etc/systemd/system/ollama.service.d/override.conf
#   scripts/bots/bot.sh up            # creates br-ollama-up (172.30.255.1)
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
#
# Ollama then listens only on the ollama-uplink bridge address. That address
# exists only on this PC: Windows and the LAN have no route to it, and bot
# networks have no route at all (isolated gateway mode). Only ollama-gw is
# attached to the uplink network.
#
# Host CLI use needs the same address:
#   export OLLAMA_HOST=172.30.255.1:11434   (e.g. in ~/.bashrc)
#
# If the bridge isn't there yet (Docker still starting), `ollama serve` fails
# to bind and systemd retries every RestartSec until it is.

[Unit]
After=docker.service
Wants=docker.service

[Service]
Environment="OLLAMA_HOST=172.30.255.1:11434"
