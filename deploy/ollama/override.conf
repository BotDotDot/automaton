# systemd drop-in for the host Ollama service. Halco installs it (needs sudo):
#
#   sudo install -D -m 644 deploy/ollama/override.conf \
#        /etc/systemd/system/ollama.service.d/override.conf
#   scripts/bots/bot.sh up            # creates br-ollama-up (172.30.255.1), once
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
#
# Ollama then listens only on the ollama-uplink bridge address. That address
# exists only on this PC: Windows and the LAN have no route to it, and bot
# networks have no route at all (isolated gateway mode). Only ollama-gw is
# attached to the uplink network.
#
# Host CLI use needs the same address:
#   export OLLAMA_HOST=172.30.255.1:11434   (e.g. in ~/.bashrc)
#
# Boot order: Docker restores the ollama-uplink network (and its bridge) when
# it starts. Ollama starts after Docker, waits up to 60s for the bridge
# address, and if it still isn't there, fails and is retried every 5s with no
# start limit, so it comes up as soon as the bridge exists.
#
# Keep 172.30.255.1 and br-ollama-up in sync with deploy/bots.conf
# (a unit test checks this).

[Unit]
After=docker.service
Wants=docker.service
StartLimitIntervalSec=0

[Service]
Environment="OLLAMA_HOST=172.30.255.1:11434"
ExecStartPre=/bin/sh -c 'for i in $(seq 1 30); do /usr/sbin/ip -4 -o addr show dev br-ollama-up 2>/dev/null | grep -q " 172.30.255.1/" && exit 0; sleep 2; done; echo "br-ollama-up (172.30.255.1) missing; run scripts/bots/bot.sh up" >&2; exit 1'
Restart=always
RestartSec=5
